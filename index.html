<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador AgroSustentável | Agrinho 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🌱 Simulador AgroSustentável</h1>
        <p class="subtitulo">Agrinho 2026: Equilíbrio entre Produção e Meio Ambiente</p>
    </header>

    <div class="form-agro">
        <div class="input-group">
            <label for="cultura">Selecione a Cultura:</label>
            <select id="cultura">
                <option value="hortalica">Hortaliças (Folhosas)</option>
                <option value="milho">Plantação de Milho</option>
                <option value="soja">Plantação de Soja</option>
            </select>
        </div>

        <div class="input-group">
            <label for="area">Área Total do Plantio (m²):</label>
            <input type="number" id="area" placeholder="Ex: 500" min="1">
        </div>

        <div class="input-group">
            <label for="clima">Condição Climática Atual:</label>
            <select id="clima">
                <option value="ensolarado">Ensolarado (Céu Limpo)</option>
                <option value="nublado">Nublado / Parcialmente Nublado</option>
                <option value="chuvoso">Chuvoso (Previsão de Chuva)</option>
            </select>
        </div>

        <button onclick="calcular()">Calcular Necessidades</button>
    </div>

    <div id="resultado">
        <div class="alerta-agua" id="res-agua"></div>
        <div class="alerta-sol" id="res-sol"></div>
    </div>

    <footer>
        Projeto desenvolvido para o Concurso Agrinho 2026
    </footer>
</div>

<script src="script.js"></script>

</body>
</html>
